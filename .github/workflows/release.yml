name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw 'Version must look like v1.0.0 or v1.0.0-rc.1'
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install pyinstaller numpy pyaudiowpatch google-genai
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean LiveTranslate.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }
          if (-not (Test-Path 'dist/LiveTranslate/LiveTranslate.exe')) {
            throw 'Built executable is missing'
          }

      - name: Package and publish release
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "LiveTranslate-$env:RELEASE_TAG-windows-x64.zip"
          Compress-Archive -Path 'dist/LiveTranslate' -DestinationPath $archive
          gh release create "$env:RELEASE_TAG" "$archive" --title "$env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }